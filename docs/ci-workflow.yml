# Optional GitHub Actions CI.
#
# GitHub Apps used by this workspace are not allowed to create files under
# .github/workflows, so this file lives in docs/. To enable CI, copy it:
#
#   mkdir -p .github/workflows && cp docs/ci-workflow.yml .github/workflows/ci.yml
#
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir=.wrangler-dist
